name: Signaux IA+CROSS V3

on:
  schedule:
    # quelques minutes après chaque clôture de bougie 4h (heures UTC),
    # avec un second passage de secours
    - cron: "6 0,4,8,12,16,20 * * *"
    - cron: "36 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      status:
        description: "Envoyer aussi un message d'état sur Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: signaux
  cancel-in-progress: false

jobs:
  signaux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcul des signaux
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal.py ${{ (github.event_name == 'workflow_dispatch' && inputs.status) && '--status' || '' }}
      - name: Mémoriser la dernière bougie traitée
        run: |
          git config user.name "ia-cross-bot"
          git config user.email "ia-cross-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Dernière bougie traitée"
          git push
