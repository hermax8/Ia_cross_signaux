name: Signaux IA+CROSS V3

on:
  schedule:
    # quelques minutes après chaque clôture de bougie 4h (heures UTC),
    # avec un second passage de secours
    - cron: "6 0,4,8,12,16,20 * * *"
    - cron: "36 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      status:
        description: "Envoyer aussi un message d'état sur Telegram"
        type: boolean
        default: true
      test_kraken:
        description: "Tester seulement la connexion Kraken (solde et positions, aucun ordre)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signaux
  cancel-in-progress: false

jobs:
  signaux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcul des signaux
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          LEVIER: ${{ vars.LEVIER }}
          PART_TOP10: ${{ vars.PART_TOP10 }}
          PART_DOT: ${{ vars.PART_DOT }}
          CAPITAL_SIMULATION: ${{ vars.CAPITAL_SIMULATION }}
        run: >-
          python signal.py
          ${{ (github.event_name == 'workflow_dispatch' && inputs.status) && '--status' || '' }}
          ${{ (github.event_name == 'workflow_dispatch' && inputs.test_kraken) && '--test-kraken' || '' }}
      - name: Mémoriser la dernière bougie traitée
        if: always()
        run: |
          git config user.name "ia-cross-bot"
          git config user.email "ia-cross-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Dernière bougie traitée"
          git push
